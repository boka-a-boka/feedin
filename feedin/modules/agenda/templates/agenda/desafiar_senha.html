{% extends "agenda/base_agenda.html" %}

{% block title %}Confirmar Senha | Módulo de Serviços{% endblock %}

{% block content %}
<div class="card auth-card p-4 bg-white">
    <div class="text-center mb-4">
        <div class="d-inline-flex p-3 bg-light rounded-circle mb-3">
            <i class="bi bi-shield-lock text-dark fs-2"></i>
        </div>
        <h5 class="fw-bold m-0 text-dark">Olá, {{ cliente.nome.split()[0] }}!</h5>
        <p class="text-muted small mt-1">Por segurança, confirme sua senha de acesso</p>
    </div>

    <form action="{{ url_for('agenda.desafiar_senha', cliente_id=cliente.id) }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="mb-4">
            <label for="senha_login" class="form-label small fw-semibold text-secondary">Senha de Acesso</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0 ps-1 py-2 rounded-end-3 small" id="senha_login" name="senha_login" placeholder="Digite sua senha" required>
            </div>
        </div>

        <button type="submit" class="btn btn-modulo btn-lg w-100 rounded-pill py-2 fs-6 fw-semibold shadow-sm mb-3">
            Acessar Painel <i class="bi bi-check-circle ms-1"></i>
        </button>

        <div class="text-center">
            <a href="{{ url_for('agenda.identificar_usuario') }}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left"></i> Usar outro e-mail
            </a>
        </div>
    </form>
</div>
{% endblock %}
