<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Acesso Urbana | Módulo de Serviços{% endblock %}</title>

    <!-- LINKS ATUALIZADOS E ULTRAESTÁVEIS DO BOOTSTRAP 5 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS do Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- JS do Flatpickr e Tradução PT-BR -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>

    {% block extra_css %}
        <link rel="stylesheet" href="{{ url_for('agenda.static', filename='css/agenda_auth.css') }}">
    {% endblock %}

    <style>
    :root {
        /* 🎨 PALETA FEEDIN (PREMIUM DARK DEFAULT)
           Enquanto não houver empresa selecionada, manda a nossa identidade neutra/escura. */
        --biz-primary: {{ session.get('empresa_cor_primaria', cor_ativa_sistema|default('#111827')) }};
        --biz-secondary: {{ session.get('empresa_cor_secundaria', '#1F2937') }};
    }

    /* Sobrescreve classes chave para manter a consistência com o tema escuro */
    .bg-primary {
        background-color: var(--biz-primary) !important;
    }

    .btn-primary {
        background-color: var(--biz-primary) !important;
        border-color: var(--biz-primary) !important;
        color: #ffffff !important;
    }

    .btn-primary:hover {
        opacity: 0.95;
    }

    .text-primary {
        color: var(--biz-primary) !important;
    }

    .border-primary {
        border-color: var(--biz-primary) !important;
    }

    /* Gradiente escuro e fluido para os Cards Hero */
    .bg-gradient-brand {
        background: linear-gradient(135deg, var(--biz-primary) 0%, var(--biz-secondary) 100%) !important;
    }

    .bg-dark-card {
        background-color: #1E293B !important;
    }
    </style>
</head>
<body>

    <!-- Wrapper que força a centralização vertical e horizontal -->
    <div class="wrapper-principal">
        <div style="width: 100%; max-width: 480px;">

            <!-- Área de Alertas -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} p-3 mb-4 rounded-3 small shadow-sm" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Conteúdo da Tela -->
            {% block content %}{% endblock %}

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        let acionadorInstalacaoPWA = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            acionadorInstalacaoPWA = e;
            document.dispatchEvent(new CustomEvent('pwaProntoParaInstalar'));
            console.log("💾 [PWA GLOBAL] Sistema operacional pronto e aguardando clique para instalação.");
        });

        async function executarInstalacaoPWA() {
            if (!acionadorInstalacaoPWA) {
                alert("O aplicativo já está instalado ou seu navegador não suporta esta função no momento.");
                return;
            }

            acionadorInstalacaoPWA.prompt();
            const { outcome } = await acionadorInstalacaoPWA.userChoice;
            console.log(`💻 [PWA] Resposta do usuário para instalação: ${outcome}`);

            if (outcome === 'accepted') {
                acionadorInstalacaoPWA = null;
                document.dispatchEvent(new CustomEvent('pwaInstaladoComSucesso'));
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
