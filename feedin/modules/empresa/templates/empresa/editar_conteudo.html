{% extends "empresa/base_empresa.html" %}

{% block title %}Editar História e Propósito - {{ local.nome }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md my-6">
    <div class="border-b pb-4 mb-6">
        <h1 class="text-xl font-bold text-gray-900">História e Propósito</h1>
        <p class="text-sm text-gray-500">Conecte-se com Piracicaba contando a origem do seu negócio.</p>
    </div>

    <form action="{{ url_for('empresa.editar_conteudo_institucional', empresa_id=local.id) }}" method="POST" class="space-y-5">
        
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Ano de Fundação</label>
            <input type="number" name="ano_fundacao" placeholder="Ex: 1994" min="1800" max="2026"
                   value="{{ local.ano_fundacao if local.ano_fundacao else '' }}"
                   class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Nossa História (Resgate de Memória)</label>
            <textarea name="historia" rows="5" placeholder="Conte como a empresa nasceu, os desafios e sua ligação com o bairro..."
                      class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm leading-relaxed">{{ local.historia if local.historia else '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Missão / Propósito</label>
            <textarea name="missao" rows="3" placeholder="Qual o impacto real que vocês causam na vida dos clientes?"
                      class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">{{ local.missao if local.missao else '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Valores fundamentais (Separados por vírgula)</label>
            <input type="text" name="valores" placeholder="Ex: Confiança, Tradição, Respeito"
                   value="{{ local.valores if local.valores else '' }}"
                   class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm">
        </div>

        <div class="pt-4 flex items-center justify-end space-x-3">
            <a href="{{ url_for('empresa.vitrine_institucional', empresa_id=local.id) }}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                Voltar
            </a>
            <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-sm transition">
                Salvar Narrativa
            </button>
        </div>
    </form>
</div>
{% endblock %}
