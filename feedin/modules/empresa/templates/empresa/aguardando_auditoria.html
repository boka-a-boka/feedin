{% block content %}
<div class="min-h-screen py-8 d-flex align-items-center" style="background: linear-gradient(135deg, #fbfbf8 0%, #f6f4ee 50%, #efece3 100%);">
    <div class="container text-center" style="max-width: 550px;">
        <div class="bg-white p-5 rounded-4 shadow-md border border-2 border-secondary-subtle">
            <div class="text-warning mb-3">
                <i class="bi bi-hourglass-split" style="font-size: 3rem;"></i>
            </div>
            <h4 class="fw-black text-dark mb-2">Documentação em Análise</h4>
            <p class="text-muted small mb-4">Recebemos seus dados cadastrais e arquivos de compliance com sucesso. Nossa equipe de mesa está avaliando as informações para liberar seus acessos.</p>

            {% if veio_do_hub %}
                <a href="{{ url_for('hub') }}" class="btn btn-dark fw-bold px-4 py-2 rounded-3 w-100" style="background-color: #111827;">
                    <i class="bi bi-grid-3x3-gap-fill me-2"></i> Voltar para o Hub
                </a>
            {% else %}
                <a href="{{ url_for('realizar_logout') }}" class="btn btn-outline-danger fw-bold px-4 py-2 rounded-3 w-100">
                    <i class="bi bi-box-arrow-right me-2"></i> Sair do Aplicativo
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
