{% extends "auth/base_auth.html" %}

{% block title %}Validação Civil | FeedIn{% endblock %}

{% block content %}
<div class="auth-container my-5">
    <div class="card auth-card p-4 p-md-5 rounded-4">

        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 bg-light rounded-3 mb-3 text-secondary border">
                <i class="bi bi-shield-check fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Homologação de Identidade</h4>
            <p class="text-muted small">Confronte seus dados oficiais com o cofre de segurança municipal</p>
        </div>

        <form action="{{ url_for('auth.processar_identidade') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="hidden" name="next_url" value="{{ next_url }}"/>

            <div class="mb-3">
                <label for="cpf" class="form-label small fw-bold text-secondary text-uppercase tracking-wider">CPF</label>
                <div class="input-group">
                    <span class="input-group-text input-group-text-custom border-end-0"><i class="bi bi-card-text"></i></span>
                    <input type="text" class="form-control form-control-custom border-start-0 ps-2"
                           id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="form-text small text-muted">Seu CPF é encriptado e usado apenas para prova de propriedade.</div>
            </div>

            <div class="mb-3">
                <label for="nome_completo" class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Nome Completo</label>
                <div class="input-group">
                    <span class="input-group-text input-group-text-custom border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control form-control-custom border-start-0 ps-2 text-uppercase"
                           id="nome_completo" name="nome_completo" placeholder="Escreva como está no seu documento" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="data_nascimento" class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Data de Nascimento</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom border-end-0"><i class="bi bi-calendar-date"></i></span>
                        <input type="text" class="form-control form-control-custom border-start-0 ps-2"
                               id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA" maxlength="10" required autocomplete="off">
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <label for="estado_civil" class="form-label small fw-bold text-secondary text-uppercase tracking-wider">Estado Civil</label>
                    <div class="input-group">
                        <span class="input-group-text input-group-text-custom border-end-0"><i class="bi bi-heart"></i></span>
                        <select class="form-select form-control-custom border-start-0 ps-2" id="estado_civil" name="estado_civil" required>
                            <option value="" disabled selected>Selecione...</option>
                            <option value="SOLTEIRO(A)">Solteiro(a)</option>
                            <option value="CASADO(A)">Casado(a)</option>
                            <option value="DIVORCIADO(A)">Divorciado(a)</option>
                            <option value="VIÚVO(A)">Viúvo(a)</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-auth-primary btn-lg w-100 fw-bold shadow-sm py-3 mt-2">
                Validar Identidade Civil <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>
    </div>
</div>

<script>
    // Máscara dinâmica para o CPF
    document.getElementById('cpf').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, "");
        if (value.length > 11) value = value.slice(0, 11);
        if (value.length > 9) value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})$/, "$1.$2.$3-$4");
        else if (value.length > 6) value = value.replace(/^(\d{3})(\d{3})(\d{1,3})$/, "$1.$2.$3");
        else if (value.length > 3) value = value.replace(/^(\d{3})(\d{1,3})$/, "$1.$2");
        e.target.value = value;
    });

    // Máscara dinâmica para Data de Nascimento (DD/MM/AAAA)
    document.getElementById('data_nascimento').addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, "");
        if (value.length > 8) value = value.slice(0, 8);
        if (value.length > 4) value = value.replace(/^(\d{2})(\d{2})(\d{1,4})$/, "$1/$2/$3");
        else if (value.length > 2) value = value.replace(/^(\d{2})(\d{1,2})$/, "$1/$2");
        e.target.value = value;
    });
</script>
{% endblock %}
