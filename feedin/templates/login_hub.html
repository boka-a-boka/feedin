<!DOCTYPE html>
<html lang="pt-br" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FeedIn Ecossistema - Login Unificado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-login-hub {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
        }
        .form-control-hub {
            background-color: #111827 !important;
            border: 1px solid #374151 !important;
            color: #ffffff !important;
        }
        .form-control-hub:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25) !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container" style="max-width: 420px;">

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show border-0 bg-danger text-white small shadow-sm mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="text-center mb-4">
            <h2 class="fw-bold text-warning"><i class="bi bi-grid-3x3-gap-fill"></i> FeedIn HUB</h2>
            <p class="text-muted small">Insira suas chaves de acesso para abrir seus módulos autorizados</p>
        </div>

<div class="card card-login-hub p-4 shadow-lg">
            <form method="POST" action="{{ url_for('central_hub') }}">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold text-muted">E-mail de Acesso</label>
                    <input type="email" name="email" id="email" class="form-control form-control-hub py-2 rounded-3" placeholder="seuemail@provedor.com" required autocomplete="username">
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label small fw-semibold text-muted">Sua Senha</label>
                    <input type="password" name="senha" id="senha" class="form-control form-control-hub py-2 rounded-3" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-warning w-100 rounded-pill py-2 fw-bold text-dark shadow-sm">
                    <i class="bi bi-shield-lock-fill me-1"></i> Validar Credenciais
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar para o Portal da Cidade</a>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
